#######################################################################################
#@TYPE: Distribution
#@NAME: qti-distro-rb-perf
#@DESCRIPTION: Qualcomm Technologies, Inc. Full Reference Stack Linux Distribution
# (glibc based) with performance orientation. Serial console and a few debug features in
# base line distro are disabled. Uses a kernel config targeting faster bootup and performance.
# Allows root user access.
#
# Supported DISTROOVERRIDES are
#  * qti-distro-base
#  * qti-distro-perf
#  * qti-distro-fullstack-perf
#  * qti-distro-rb-perf
#
# For same variable override precedence order is
# qti-distro-rb-perf > qti-distro-fullstack-perf > qti-distro-perf > qti-distro-base
#######################################################################################

# Honor qti-distro-perf override
DISTROOVERRIDES =. "qti-distro-perf:"

require conf/distro/include/qti-distro-fullstack.inc

DISTRO_NAME = "QTI Linux robotics platform distro targeting performance builds."

# Enable imu client
# DISTRO_FEATURES += "imu-client"

# Enable ros2
DISTRO_FEATURES += "ros2"

# Enable qti-gst-ros2
# DISTRO_FEATURES += "qti-gst-ros2"

# Enable virtualization
# DISTRO_FEATURES += "virtualization"

# Enable RealSense camera solution
# DISTRO_FEATURES += "librealsense2"

#Enable vSLAM
# DISTRO_FEATURES += "vslam"

#Enable QTI DFS
# DISTRO_FEATURES += "qti-dfs"

#Enable IB2C
DISTRO_FEATURES += "qti-ib2c"

#Enable vulkan
DISTRO_FEATURES += "vulkan"

# Bring in debug utilities.
DISTRO_EXTRA_RDEPENDS += "packagegroup-qti-debug-tools"

DISTRO_FEATURES:remove = " \
        selinux \
        dm-verity \
        fbdev \
        opencl \
        opengl \
        tensorflow-lite \
        qti-fastcv \
        qti-security \
        qwesd \
"
