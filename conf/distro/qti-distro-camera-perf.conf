#######################################################################################
#@TYPE: Distribution
#@NAME: qti-distro-camera-perf
#@DESCRIPTION: Qualcomm Technologies, Inc. Full Reference Stack Linux Distribution
# (glibc based) with performance orientation for camera product. Serial console and a few 
# debug features in base line distro are disabled.
# Uses a kernel config targeting faster bootup and performance.
# Allows root user access.
#
# Supported DISTROOVERRIDES are
#  * qti-distro-base
#  * qti-distro-perf
#  * qti-distro-camera
#  * qti-distro-camera-perf
#
# For same variable override precedence order is
# qti-distro-camera-perf > qti-distro-camera > qti-distro-perf > qti-distro-base
#######################################################################################

# Honor qti-distro-perf override
DISTROOVERRIDES =. "qti-distro-perf:qti-distro-camera:"

require conf/distro/include/qti-distro-fullstack.inc

DISTRO_NAME = "QTI Linux full reference stack distro targeting performance builds for camera product."

DISTRO_EXTRA_RDEPENDS += "packagegroup-selinux-minimal"
PREFERRED_PROVIDER_virtual/refpolicy = "refpolicy-mls-robotics"

# Bring in debug utilities.
DISTRO_EXTRA_RDEPENDS += "packagegroup-qti-debug-tools"

DISTRO_FEATURES += "qti-ib2c"
