#######################################################################################
#@TYPE: Distribution
#@NAME: qti-distro-nogplv3-debug
#@DESCRIPTION: Qualcomm Technologies, Inc. Reference Linux Distribution
# (glibc based) for nogplv3 having debugging capabilities. Not optimized for
# performance.
#
# Supported DISTROOVERRIDES are
#  * qti-distro-base
#  * qti-distro-debug
#  * qti-distro-nogplv3-debug
#
# For same variable override precedence order is
# qti-distro-nogplv3-debug > qti-distro-debug > qti-distro-base
#######################################################################################

# Honor qti-distro-debug override
DISTROOVERRIDES =. "qti-distro-debug:"

require conf/distro/include/qti-distro-nogplv3.inc

DISTRO_NAME = "QTI Linux reference nogplv3 distro with debug capabilities."

# Set DEBUG_BUILD to use flags from DEBUG_OPTIMIZATION variable
DEBUG_BUILD = "1"

