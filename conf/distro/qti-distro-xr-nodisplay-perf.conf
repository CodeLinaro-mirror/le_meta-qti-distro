#######################################################################################
#@TYPE: Distribution
#@NAME: qti-distro-xr-nodisplay-perf
#@DESCRIPTION: Qualcomm Technologies, Inc. Reference Linux Distribution
# (glibc based) for extended reality without display having performance orientation.
# Serial console and a few debug features in base distro are disabled. 
# Uses a kernel config targeting faster bootup and performance. Allows root user access.
#
# Supported DISTROOVERRIDES are
#  * qti-distro-base
#  * qti-distro-perf
#  * qti-distro-xr-nodisplay-perf
#
# For same variable override precedence order is
# qti-distro-xr-nodisplay-perf > qti-distro-perf > qti-distro-base
#######################################################################################

# Honor qti-distro-perf override
DISTROOVERRIDES =. "qti-distro-perf:"

require conf/distro/include/qti-distro-xr-nodisplay.inc

DISTRO_NAME = "QTI Linux reference extended reality distro without display targeting performance builds."

# Bring in debug utilities.
DISTRO_EXTRA_RDEPENDS += "packagegroup-qti-debug-tools"
