# layer has a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += " ${LAYERDIR}/recipes-*/*/*.bb \
             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "freescale-distro"
BBFILE_PATTERN_freescale-distro := "^${LAYERDIR}/"
BBFILE_PRIORITY_freescale-distro = "4"

LAYERSERIES_COMPAT_freescale-distro = "zeus dunfell"

BBFILE_COLLECTIONS        += "qti-distro"
BBFILE_PATTERN_qti-distro := "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-distro = "10"

LAYERSERIES_COMPAT_qti-distro = "dunfell"
